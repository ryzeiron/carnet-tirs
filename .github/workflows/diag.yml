name: diag
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: apcsdghdmzspovxdlmbv
    steps:
      - run: |
          mkdir out
          { echo "== etat"; curl -sS "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $TOKEN" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("status"),d.get("message",""))'
            ST=$(curl -sS "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $TOKEN" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status",""))')
            if [ "$ST" = "INACTIVE" ] || [ "$ST" = "PAUSED" ]; then echo "== relance"; curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/restore" -H "Authorization: Bearer $TOKEN" -w " http %{http_code}\n"; fi
          } > out/diag.txt 2>&1
          cat out/diag.txt
          cd out && git init -q && git checkout -q -b diag-out && git config user.email bot@x && git config user.name bot && git add -A && git commit -qm out && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
