name: diag
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: apcsdghdmzspovxdlmbv
    steps:
      - run: |
          mkdir out
          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth" -H "Authorization: Bearer $TOKEN" | python3 -c 'import json,sys;d=json.load(sys.stdin);print({k:d.get(k) for k in ["jwt_exp","refresh_token_rotation_enabled","security_refresh_token_reuse_interval","sessions_timebox","sessions_inactivity_timeout","sessions_single_per_user","sessions_single_per_user"]})' > out/diag.txt 2>&1
          cd out && git init -q && git checkout -q -b diag-out && git config user.email bot@x && git config user.name bot && git add -A && git commit -qm out && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
