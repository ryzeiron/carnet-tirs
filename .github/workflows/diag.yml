name: diag
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: apcsdghdmzspovxdlmbv
    steps:
      - run: |
          mkdir out
          q(){ python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$1" > body.json
               curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @body.json; echo; }
          {
          echo "== matchs Dunkerque"
          q "select i.id, i.data->>'date' as date, i.updated_at, (select count(*) from items s where s.team_id=i.team_id and s.kind='shot' and not s.deleted and s.data->>'match'=i.id) as actions from items i where i.kind='match' and i.data->>'adv' ilike '%dunk%'"
          echo "== activite depuis 14h (heure de Paris) par equipe"
          q "select case when t.name='__perso__' then 'PERSO' else t.name end as team, i.kind, count(*), max(i.updated_at) from items i join teams t on t.id=i.team_id where i.updated_at > '2026-10-18 12:00:00+00' group by 1,2 order by 4 desc"
          echo "== derniers logins"
          q "select email, last_sign_in_at from auth.users where email in ('antoningiolda@gmail.com','charly.lebel@cbmhandball.fr','enzo.bebin@cbmhandball.fr') order by 2 desc"
          } > out/diag.txt 2>&1
          cd out && git init -q && git checkout -q -b diag-out && git config user.email bot@x && git config user.name bot && git add -A && git commit -qm out && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
