name: diag
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: apcsdghdmzspovxdlmbv
    steps:
      - run: |
          mkdir out
          {
          echo "== etat"; curl -sS "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $TOKEN" | head -c 600; echo
          echo "== auth health"; curl -sS -m 20 "https://$REF.supabase.co/auth/v1/health" -H "apikey: sb_publishable_OAt73IQCwvpDrIff_mE_Cg_eAJ-205M" -w "  http %{http_code} %{time_total}s\n"
          echo "== rest"; curl -sS -m 20 -o /dev/null "https://$REF.supabase.co/rest/v1/teams?select=id&limit=1" -H "apikey: sb_publishable_OAt73IQCwvpDrIff_mE_Cg_eAJ-205M" -w "http %{http_code} %{time_total}s\n"
          echo "== cors preflight otp"; curl -sS -m 20 -o /dev/null -X OPTIONS "https://$REF.supabase.co/auth/v1/otp" -H "Origin: https://ryzeiron.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,authorization,content-type,x-client-info" -w "http %{http_code}\n" -D - | grep -i -E "^HTTP|access-control" 
          echo "== dns"; getent hosts $REF.supabase.co
          python3 -c 'import json;print(json.dumps({"query":"select created_at, payload->>'"'"'action'"'"' as action, payload->>'"'"'actor_username'"'"' as who from auth.audit_log_entries where created_at > now() - interval '"'"'2 days'"'"' order by created_at desc limit 15"}))' > q.json
          echo "== journal auth (2 jours)"; curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @q.json
          } > out/diag.txt 2>&1
          cd out && git init -q && git checkout -q -b diag-out && git config user.email bot@x && git config user.name bot && git add -A && git commit -qm out && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
