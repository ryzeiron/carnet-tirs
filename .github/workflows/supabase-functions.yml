name: supabase-functions
on:
  workflow_dispatch:
  push:
    paths: ["supabase/functions/**", ".github/workflows/supabase-functions.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: apcsdghdmzspovxdlmbv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Déployer la fonction FFHB (lecture des calendriers)
        run: supabase functions deploy ffhb --project-ref "$REF" --no-verify-jwt --use-api
      - name: Vérifier qu'elle répond
        run: |
          sleep 5
          curl -sS -f -X POST "https://$REF.supabase.co/functions/v1/ffhb" -H "Content-Type: application/json" \
            -d '{"url":"https://www.ffhandball.fr/competitions/saison-2026-2027-22/national/nationale-1-masculine-2026-2027-32469/"}' | head -c 300
